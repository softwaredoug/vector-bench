[project]
name = "vector-bench"
version = "0.1.0"
description = "Tooling for benchmarking vector search solutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cheat-at-search @ git+https://github.com/softwaredoug/cheat-at-search.git",
]

[project.scripts]
vector-bench = "vector_bench.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
