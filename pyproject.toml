[project]
name = "vector-bench"
version = "0.1.0"
description = "Tooling for benchmarking vector search solutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cheat-at-search @ git+https://github.com/softwaredoug/cheat-at-search.git",
    "h5py>=3.11.0",
    "tqdm>=4.66.0",
]

[project.scripts]
vector-bench = "vector_bench.main:main"
prepare = "vector_bench.prepare:main"
naive-vector-search = "exps.naive_search:main"

[dependency-groups]
dev = [
    "flake8-tidy-imports>=4.12.0",
    "pyright>=1.1.390",
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["vector_bench", "exps"]
typeCheckingMode = "standard"
