repos:
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
      - id: e2e-tests
        name: e2e tests
        entry: uv run pytest tests/e2e
        language: system
        pass_filenames: false
      - id: flake8-exps-boundary
        name: flake8 exps dependency boundary
        entry: uv run flake8 --append-config=.flake8-exps
        language: system
        files: ^exps/
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
